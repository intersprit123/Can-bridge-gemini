name: Gemini CamBridge Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: TypeScript check
        run: npm run lint
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: gemini-cambridge-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
