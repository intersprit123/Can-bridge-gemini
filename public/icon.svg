<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="lensGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with 15% safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Neon Ring (Active Broadcast Sensor) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="12" filter="url(#glow)" />
  
  <!-- Camera Aperture Housing -->
  <circle cx="256" cy="256" r="128" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Optical Lens -->
  <circle cx="256" cy="256" r="102" fill="url(#lensGrad)" />
  
  <!-- Inner Pupil / Iris -->
  <circle cx="256" cy="256" r="52" fill="#030712" />
  
  <!-- Glass Reflection -->
  <ellipse cx="225" cy="215" rx="36" ry="20" transform="rotate(-35 225 215)" fill="rgba(255,255,255,0.4)" filter="url(#glow)" />
  <ellipse cx="282" cy="295" rx="16" ry="9" transform="rotate(-35 282 295)" fill="rgba(255,255,255,0.2)" />

  <!-- Live Broadcast Indicator Dot -->
  <circle cx="370" cy="142" r="18" fill="#ef4444" filter="url(#glow)" />
  <circle cx="370" cy="142" r="8" fill="#ffffff" />
  
  <!-- Signal Waves -->
  <path d="M 330 110 A 180 180 0 0 1 402 182" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" opacity="0.8" />
  <path d="M 345 95 A 205 205 0 0 1 422 172" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.6" />
</svg>
